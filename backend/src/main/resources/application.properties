# ===================================================================
# Expense Management System - Application Configuration
# ===================================================================

# Application Info & Server Port
spring.application.name=expense-management-backend
server.port=8080

# ===================================================================
# Supabase PostgreSQL Database Configuration
# ===================================================================
# Project ID: sugnjvihcclgiffmixcc
# Direct JDBC URL (requires SSL):
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://db.sugnjvihcclgiffmixcc.supabase.co:5432/postgres?sslmode=require}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
# Replace with the password you set during project creation in Supabase:
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:YOUR_SUPABASE_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Connection Pool settings optimized for Supabase cloud connections
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=60000
spring.datasource.hikari.connection-timeout=20000

# ===================================================================
# JPA / Hibernate Configuration
# ===================================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# ===================================================================
# Supabase Project API Configuration (Storage / Auth / Functions)
# ===================================================================
supabase.url=https://sugnjvihcclgiffmixcc.supabase.co
supabase.publishable-key=sb_publishable_SWV5OEiqjRqWKX4P5xASzg_G37I529S
supabase.service-role-key=${SUPABASE_SERVICE_ROLE_KEY:}

# ===================================================================
# JWT Security Configuration (256-bit hex secret key)
# ===================================================================
application.security.jwt.secret-key=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
application.security.jwt.expiration=86400000
application.security.jwt.refresh-expiration=604800000

# ===================================================================
# File Upload Configuration (for Receipt attachments)
# ===================================================================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ===================================================================
# Logging Configuration
# ===================================================================
logging.level.com.expensemanagement=DEBUG
logging.level.org.springframework.security=INFO
