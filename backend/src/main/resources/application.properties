# ===================================================================
# Expense Management System - Application Configuration
# ===================================================================

# Application Info & Server Port
spring.application.name=expense-management-backend
server.port=8080

# ===================================================================
# Supabase PostgreSQL Database Configuration
# ===================================================================
# Load local secret overrides if present on local disk (ignored if missing in production/git)
spring.config.import=optional:file:application-local.properties,optional:file:../application-local.properties

# Supabase Connection Pooler (supports IPv4 & IPv6):
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://aws-0-ap-south-1.pooler.supabase.com:5432/postgres?sslmode=require}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres.hbpnizfduywzrhyxtkiu}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Connection Pool settings optimized for Supabase cloud connections
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=60000
spring.datasource.hikari.connection-timeout=20000

# ===================================================================
# JPA / Hibernate Configuration
# ===================================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# ===================================================================
# Security & Error Leakage Prevention
# ===================================================================
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
server.server-header=

# ===================================================================
# Supabase Project API Configuration (Storage / Auth / Functions)
# ===================================================================
supabase.url=https://hbpnizfduywzrhyxtkiu.supabase.co
supabase.publishable-key=${SUPABASE_PUBLISHABLE_KEY:}
supabase.service-role-key=${SUPABASE_SERVICE_ROLE_KEY:}

# ===================================================================
# JWT Security Configuration (256-bit hex secret key)
# ===================================================================
application.security.jwt.secret-key=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
application.security.jwt.expiration=86400000
application.security.jwt.refresh-expiration=604800000

# ===================================================================
# File Upload Configuration (for Receipt attachments)
# ===================================================================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ===================================================================
# Logging Configuration
# ===================================================================
logging.level.com.expensemanagement=DEBUG
logging.level.org.springframework.security=INFO
